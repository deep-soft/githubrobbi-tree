name: act-Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.create_release.outputs.url }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Create release.txt
      shell: bash
      run: |
        echo ${{ github.sha }} > release.txt;
        ls -la release.txt;

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # tag_name: ${{ github.ref }}
        # release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        files: |
          release.txt

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tree
            asset_name: tree-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tree.exe
            asset_name: tree-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tree
            asset_name: tree-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tree
            asset_name: tree-macos-aarch64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build release binary
      shell: bash
      run: |
        cargo build --release --target ${{ matrix.target }};
        mv \
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} \
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-${{ matrix.os }};
        ls -la ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-${{ matrix.os }};

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # tag_name: ${{ github.ref }}
        # release_name: Release ${{ github.ref }}
        files: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }}-${{ matrix.os }}
